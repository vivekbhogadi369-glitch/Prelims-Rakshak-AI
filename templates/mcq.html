<!DOCTYPE html>
<html>
<head>
  <title>MCQ Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 16px;
      color: #111827;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 20px;
    }

    .box {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .question {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .option {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 16px;
      line-height: 1.4;
      cursor: pointer;
    }

    .correct {
      background: #dcfce7;
      border: 2px solid #16a34a;
    }

    .wrong {
      background: #fee2e2;
      border: 2px solid #dc2626;
    }

    .resultBox {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #f9fafb;
      border-radius: 10px;
      line-height: 1.6;
    }

    .resultBox h3 {
      margin-top: 0;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <h1>MCQ Practice</h1>

  <div class="box">
    <label>Select Subject</label>
    <select id="subjectSelect">
      <option value="">Select Subject</option>
    </select>

    <label>Select Topic</label>
    <select id="topicSelect">
      <option value="">Select Topic</option>
    </select>
  </div>

  <div id="mcqBox" class="box" style="display:none;">
    <div id="questionText" class="question"></div>
    <div id="optionsBox"></div>

    <div id="explanationBox" class="resultBox">
      <h3>Explanation</h3>
      <p id="explanationText"></p>
    </div>

    <div id="eliminationBox" class="resultBox">
      <h3>Elimination Logic</h3>
      <p id="eliminationText"></p>
    </div>
  </div>

  <script>
    let mcqData = {};
    let currentQuestion = null;
    let answered = false;

    async function loadMCQs() {
      try {
        const response = await fetch("/static/json/mcqs_history.json");
        mcqData = await response.json();

        const subjectSelect = document.getElementById("subjectSelect");

        Object.keys(mcqData).forEach(subject => {
          const option = document.createElement("option");
          option.value = subject;
          option.textContent = subject;
          subjectSelect.appendChild(option);
        });

      } catch (error) {
        alert("MCQ JSON loading failed.");
        console.error(error);
      }
    }

    document.getElementById("subjectSelect").addEventListener("change", function () {
      const subject = this.value;
      const topicSelect = document.getElementById("topicSelect");

      topicSelect.innerHTML = '<option value="">Select Topic</option>';
      document.getElementById("mcqBox").style.display = "none";

      if (!subject) return;

      Object.keys(mcqData[subject]).forEach(topic => {
        const option = document.createElement("option");
        option.value = topic;
        option.textContent = topic;
        topicSelect.appendChild(option);
      });
    });

    document.getElementById("topicSelect").addEventListener("change", function () {
      const subject = document.getElementById("subjectSelect").value;
      const topic = this.value;

      if (!subject || !topic) return;

      currentQuestion = mcqData[subject][topic][0];
      answered = false;

      document.getElementById("mcqBox").style.display = "block";
      document.getElementById("questionText").textContent = currentQuestion.question;

      document.getElementById("explanationBox").style.display = "none";
      document.getElementById("eliminationBox").style.display = "none";

      const optionsBox = document.getElementById("optionsBox");
      optionsBox.innerHTML = "";

      Object.entries(currentQuestion.options).forEach(([key, value]) => {
        const div = document.createElement("div");
        div.className = "option";
        div.textContent = key + ") " + value;
        div.onclick = function () {
          checkAnswer(div, key);
        };
        optionsBox.appendChild(div);
      });
    });

    function checkAnswer(selectedDiv, selectedKey) {
      if (answered) return;

      answered = true;
      const correctKey = currentQuestion.correct_answer;

      const allOptions = document.querySelectorAll(".option");

      allOptions.forEach(optionDiv => {
        if (optionDiv.textContent.startsWith(correctKey + ")")) {
          optionDiv.classList.add("correct");
        }
      });

      if (selectedKey !== correctKey) {
        selectedDiv.classList.add("wrong");
      }

      document.getElementById("explanationText").textContent = currentQuestion.explanation;
      document.getElementById("eliminationText").textContent = currentQuestion.elimination_logic;

      document.getElementById("explanationBox").style.display = "block";
      document.getElementById("eliminationBox").style.display = "block";
    }

    loadMCQs();
  </script>

</body>
</html>

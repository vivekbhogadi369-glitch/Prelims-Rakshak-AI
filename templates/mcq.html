<script>
let mcqData = {};
let questions = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];

async function loadMCQs() {
  try {
    const response = await fetch("/static/json/mcqs.json");

    if (!response.ok) {
      throw new Error("mcqs.json not found");
    }

    mcqData = await response.json();

    populateSubjects();

  } catch (error) {
    alert("MCQ JSON loading failed.");
    console.error(error);
  }
}

function populateSubjects() {
  const subjectSelect = document.getElementById("subjectSelect");

  subjectSelect.innerHTML = `
    <option value="">Select Subject</option>
  `;

  Object.keys(mcqData).forEach(subject => {
    const option = document.createElement("option");
    option.value = subject;
    option.textContent = subject;
    subjectSelect.appendChild(option);
  });

  populateTopics();
}

function populateTopics() {
  const subject = document.getElementById("subjectSelect").value;
  const topicSelect = document.getElementById("topicSelect");

  topicSelect.innerHTML = `
    <option value="">Select Topic</option>
  `;

  if (!subject || !mcqData[subject]) return;

  Object.keys(mcqData[subject]).forEach(section => {

    Object.keys(mcqData[subject][section]).forEach(topic => {

      const option = document.createElement("option");

      option.value = JSON.stringify({
        section,
        topic
      });

      option.textContent = section + " → " + topic;

      topicSelect.appendChild(option);
    });
  });
}

document.getElementById("subjectSelect").addEventListener("change", function () {

  populateTopics();

  document.getElementById("mcqBox").style.display = "none";
  document.getElementById("finalBox").style.display = "none";
});

document.getElementById("topicSelect").addEventListener("change", function () {

  const subject = document.getElementById("subjectSelect").value;

  if (!subject || !this.value) return;

  const parsed = JSON.parse(this.value);

  const section = parsed.section;
  const topic = parsed.topic;

  questions =
    mcqData[subject][section][topic].questions || [];

  currentIndex = 0;
  score = 0;

  userAnswers = new Array(questions.length).fill(null);

  document.getElementById("selectionBox").style.display = "none";

  document.getElementById("backButton").style.display = "inline-block";

  document.getElementById("finalBox").style.display = "none";

  document.getElementById("mcqBox").style.display = "block";

  showQuestion();
});

function showQuestion() {

  const currentQuestion = questions[currentIndex];

  const selectedAnswer = userAnswers[currentIndex];

  const progressPercent =
    Math.round(((currentIndex + 1) / questions.length) * 100);

  document.getElementById("progressBar").style.width =
    progressPercent + "%";

  document.getElementById("progressText").textContent =
    "Progress: " + progressPercent + "%";

  document.getElementById("questionCount").textContent =
    "Question " + (currentIndex + 1) + " / " + questions.length;

  document.getElementById("scoreBox").textContent =
    "Score: " + score + " / " + questions.length;

  document.getElementById("questionText").textContent =
    currentQuestion.question;

  document.getElementById("explanationBox").style.display = "none";

  document.getElementById("eliminationBox").style.display = "none";

  const optionsBox = document.getElementById("optionsBox");

  optionsBox.innerHTML = "";

  Object.entries(currentQuestion.options).forEach(([key, value]) => {

    const div = document.createElement("div");

    div.className = "option";

    div.textContent = key + ") " + value;

    if (selectedAnswer !== null) {

      if (key === currentQuestion.correct_answer) {
        div.classList.add("correct");
      }

      if (
        key === selectedAnswer &&
        selectedAnswer !== currentQuestion.correct_answer
      ) {
        div.classList.add("wrong");
      }

    } else {

      div.onclick = function () {
        checkAnswer(key);
      };
    }

    optionsBox.appendChild(div);
  });

  if (selectedAnswer !== null) {

    document.getElementById("explanationText").textContent =
      currentQuestion.explanation;

    document.getElementById("eliminationText").textContent =
      currentQuestion.elimination_logic;

    document.getElementById("explanationBox").style.display = "block";

    document.getElementById("eliminationBox").style.display = "block";
  }

  document.getElementById("prevBtn").disabled =
    currentIndex === 0;

  if (currentIndex === questions.length - 1) {

    document.getElementById("nextBtn").textContent =
      "Finish Quiz";

  } else {

    document.getElementById("nextBtn").textContent =
      "Next";
  }
}

function checkAnswer(selectedKey) {

  const currentQuestion = questions[currentIndex];

  if (userAnswers[currentIndex] !== null) return;

  userAnswers[currentIndex] = selectedKey;

  if (selectedKey === currentQuestion.correct_answer) {
    score++;
  }

  showQuestion();
}

function previousQuestion() {

  if (currentIndex > 0) {

    currentIndex--;

    showQuestion();
  }
}

function nextQuestion() {

  if (currentIndex < questions.length - 1) {

    currentIndex++;

    showQuestion();

  } else {

    showFinalResult();
  }
}

function showFinalResult() {

  const percentage =
    Math.round((score / questions.length) * 100);

  document.getElementById("mcqBox").style.display = "none";

  document.getElementById("finalBox").style.display = "block";

  document.getElementById("finalScore").textContent =
    "Score: " + score + " / " + questions.length +
    " | Accuracy: " + percentage + "%";

  let feedback = "";

  if (percentage === 100) {

    feedback =
      "Outstanding. Perfect accuracy. You have mastered this topic at a strong UPSC practice level.";

  } else {

    feedback =
      "Good attempt. Revise the concepts and practise elimination logic again.";
  }

  document.getElementById("finalFeedback").textContent =
    feedback;

  document.getElementById("retryBtn").style.display =
    percentage === 100 ? "none" : "block";
}

function retryQuiz() {

  currentIndex = 0;

  score = 0;

  userAnswers = new Array(questions.length).fill(null);

  document.getElementById("finalBox").style.display = "none";

  document.getElementById("mcqBox").style.display = "block";

  document.getElementById("retryBtn").style.display = "block";

  showQuestion();
}

function goBack() {

  document.getElementById("selectionBox").style.display = "block";

  document.getElementById("backButton").style.display = "none";

  document.getElementById("mcqBox").style.display = "none";

  document.getElementById("finalBox").style.display = "none";

  document.getElementById("subjectSelect").value = "";

  populateTopics();

  questions = [];

  currentIndex = 0;

  score = 0;

  userAnswers = [];
}

loadMCQs();
</script>

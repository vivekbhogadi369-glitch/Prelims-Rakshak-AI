<!DOCTYPE html>
<html>
<head>
  <title>MCQ Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 16px;
      color: #111827;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 20px;
    }

    .box {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    .language-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .lang-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #e5e7eb;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .active-lang {
      background: #1f2937;
      color: white;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .question-count {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .score {
      font-size: 15px;
      color: #111827;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .question {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .option {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 16px;
      line-height: 1.4;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .correct {
      background: #dcfce7;
      border: 2px solid #16a34a;
    }

    .wrong {
      background: #fee2e2;
      border: 2px solid #dc2626;
    }

    .resultBox {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #f9fafb;
      border-radius: 10px;
      line-height: 1.6;
    }

    .resultBox h3 {
      margin-top: 0;
      font-size: 17px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .nav-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #1f2937;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .nav-buttons button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <h1>MCQ Practice</h1>

  <div class="box">

    <div class="language-buttons">
      <button class="lang-btn active-lang" onclick="changeLanguage('english', this)">
        English
      </button>

      <button class="lang-btn" onclick="changeLanguage('telugu', this)">
        తెలుగు
      </button>

      <button class="lang-btn" onclick="changeLanguage('hindi', this)">
        हिन्दी
      </button>
    </div>

    <label>Select Subject</label>
    <select id="subjectSelect">
      <option value="">Select Subject</option>
    </select>

    <label>Select Topic</label>
    <select id="topicSelect">
      <option value="">Select Topic</option>
    </select>
  </div>

  <div id="mcqBox" class="box" style="display:none;">
    <div id="questionCount" class="question-count"></div>
    <div id="scoreBox" class="score"></div>
    <div id="questionText" class="question"></div>
    <div id="optionsBox"></div>

    <div id="explanationBox" class="resultBox">
      <h3>Explanation</h3>
      <p id="explanationText"></p>
    </div>

    <div id="eliminationBox" class="resultBox">
      <h3>Elimination Logic</h3>
      <p id="eliminationText"></p>
    </div>

    <div class="nav-buttons">
      <button id="prevBtn" onclick="previousQuestion()">Previous</button>
      <button id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
  </div>

  <script>
    let currentLanguage = "english";

    function changeLanguage(language, button) {
      currentLanguage = language;

      document.querySelectorAll(".lang-btn").forEach(btn => {
        btn.classList.remove("active-lang");
      });

      button.classList.add("active-lang");

      alert(language + " mode coming next.");
    }
  </script>

</body>
</html>

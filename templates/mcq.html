<!DOCTYPE html>
<html>
<head>
  <title>MCQ Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 16px;
      color: #111827;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    label {
      font-size: 17px;
      font-weight: bold;
      display: block;
      margin: 12px 0 8px;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      margin-bottom: 12px;
      background: #f9fafb;
    }

    .back-btn {
      display: none;
      margin-bottom: 14px;
      background: #1f2937;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .progress-container {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #1f2937;
      transition: width 0.4s ease;
    }

    .progress-text, .question-count, .score {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #4b5563;
    }

    .question {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.8;
      margin: 20px 0 24px;
      white-space: pre-line;
    }

    .option {
      background: #f3f4f6;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 17px;
      line-height: 1.7;
      border: 2px solid transparent;
      cursor: pointer;
      white-space: pre-line;
    }

    .correct {
      background: #dcfce7;
      border: 2px solid #16a34a;
    }

    .wrong {
      background: #fee2e2;
      border: 2px solid #dc2626;
    }

    .resultBox {
      display: none;
      margin-top: 18px;
      background: #f9fafb;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.8;
    }

    .resultBox h3 {
      margin-top: 0;
      font-size: 20px;
    }

    .resultBox p {
      white-space: pre-line;
      font-size: 16px;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    .nav-buttons button, .retry-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-buttons button:disabled {
      background: #9ca3af;
    }

    .final-score {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.7;
    }

    .feedback {
      text-align: center;
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 20px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

<h1>MCQ Practice</h1>

<div id="selectionBox" class="box">
  <label>Select Subject</label>
  <select id="subjectSelect"></select>

  <label>Select Topic</label>
  <select id="topicSelect"></select>
</div>

<button id="backButton" class="back-btn" onclick="goBack()">← Back</button>

<div id="mcqBox" class="box" style="display:none;">
  <div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div id="progressText" class="progress-text"></div>
  <div id="questionCount" class="question-count"></div>
  <div id="scoreBox" class="score"></div>

  <div id="questionText" class="question"></div>
  <div id="optionsBox"></div>

  <div id="explanationBox" class="resultBox">
    <h3>Explanation</h3>
    <p id="explanationText"></p>
  </div>

  <div id="eliminationBox" class="resultBox">
    <h3>Elimination Logic</h3>
    <p id="eliminationText"></p>
  </div>

  <div class="nav-buttons">
    <button id="prevBtn" onclick="previousQuestion()">Previous</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>
  </div>
</div>

<div id="finalBox" class="box" style="display:none;">
  <div id="finalScore" class="final-score"></div>
  <div id="finalFeedback" class="feedback"></div>
  <button id="retryBtn" class="retry-btn" onclick="retryQuiz()">Retry Quiz</button>
</div>

<script>
let mcqData = {};
let questions = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];

async function loadMCQs() {
  try {
    const response = await fetch("/static/json/mcqs.json");

    if (!response.ok) {
      throw new Error("mcqs.json not found");
    }

    mcqData = await response.json();
    populateSubjects();

  } catch (error) {
    alert("MCQ JSON loading failed. Check /static/json/mcqs.json");
    console.error(error);
  }
}

function populateSubjects() {
  const subjectSelect = document.getElementById("subjectSelect");

  subjectSelect.innerHTML = "";

  const defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.textContent = "Select Subject";
  subjectSelect.appendChild(defaultOption);

  Object.keys(mcqData).forEach(subject => {
    const option = document.createElement("option");
    option.value = subject;
    option.textContent = subject;
    subjectSelect.appendChild(option);
  });

  populateTopics();
}

function populateTopics() {
  const subject = document.getElementById("subjectSelect").value;
  const topicSelect = document.getElementById("topicSelect");

  topicSelect.innerHTML = "";

  const defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.textContent = "Select Topic";
  topicSelect.appendChild(defaultOption);

  if (!subject || !mcqData[subject]) return;

  Object.keys(mcqData[subject]).forEach(section => {
    Object.keys(mcqData[subject][section]).forEach(topic => {
      const topicData = mcqData[subject][section][topic];

      if (!topicData || !Array.isArray(topicData.questions)) return;

      const option = document.createElement("option");
      option.value = JSON.stringify({ section: section, topic: topic });
      option.textContent = section + " → " + topic;
      topicSelect.appendChild(option);
    });
  });
}

document.getElementById("subjectSelect").addEventListener("change", function () {
  populateTopics();
  document.getElementById("mcqBox").style.display = "none";
  document.getElementById("finalBox").style.display = "none";
});

document.getElementById("topicSelect").addEventListener("change", function () {
  const subject = document.getElementById("subjectSelect").value;

  if (!subject || !this.value) return;

  const parsed = JSON.parse(this.value);
  const section = parsed.section;
  const topic = parsed.topic;

  questions = mcqData[subject][section][topic].questions || [];

  if (questions.length === 0) {
    alert("No questions found for this topic.");
    return;
  }

  currentIndex = 0;
  score = 0;
  userAnswers = new Array(questions.length).fill(null);

  document.getElementById("selectionBox").style.display = "none";
  document.getElementById("backButton").style.display = "inline-block";
  document.getElementById("finalBox").style.display = "none";
  document.getElementById("mcqBox").style.display = "block";

  showQuestion();
});

function showQuestion() {
  const currentQuestion = questions[currentIndex];
  const selectedAnswer = userAnswers[currentIndex];

  const progressPercent = Math.round(((currentIndex + 1) / questions.length) * 100);

  document.getElementById("progressBar").style.width = progressPercent + "%";
  document.getElementById("progressText").textContent = "Progress: " + progressPercent + "%";
  document.getElementById("questionCount").textContent = "Question " + (currentIndex + 1) + " / " + questions.length;
  document.getElementById("scoreBox").textContent = "Score: " + score + " / " + questions.length;

  document.getElementById("questionText").textContent = currentQuestion.question || "";

  document.getElementById("explanationBox").style.display = "none";
  document.getElementById("eliminationBox").style.display = "none";

  const optionsBox = document.getElementById("optionsBox");
  optionsBox.innerHTML = "";

  const options = currentQuestion.options || {};

  Object.entries(options).forEach(([key, value]) => {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = key + ") " + value;

    if (selectedAnswer !== null) {
      if (key === currentQuestion.correct_answer) {
        div.classList.add("correct");
      }

      if (key === selectedAnswer && selectedAnswer !== currentQuestion.correct_answer) {
        div.classList.add("wrong");
      }
    } else {
      div.onclick = function () {
        checkAnswer(key);
      };
    }

    optionsBox.appendChild(div);
  });

  if (selectedAnswer !== null) {
    document.getElementById("explanationText").textContent = currentQuestion.explanation || "";
    document.getElementById("eliminationText").textContent = currentQuestion.elimination_logic || "";

    document.getElementById("explanationBox").style.display = "block";
    document.getElementById("eliminationBox").style.display = "block";
  }

  document.getElementById("prevBtn").disabled = currentIndex === 0;

  document.getElementById("nextBtn").textContent =
    currentIndex === questions.length - 1 ? "Finish Quiz" : "Next";
}

function checkAnswer(selectedKey) {
  const currentQuestion = questions[currentIndex];

  if (userAnswers[currentIndex] !== null) return;

  userAnswers[currentIndex] = selectedKey;

  if (selectedKey === currentQuestion.correct_answer) {
    score++;
  }

  showQuestion();
}

function previousQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    showQuestion();
  }
}

function nextQuestion() {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    showQuestion();
  } else {
    showFinalResult();
  }
}

function showFinalResult() {
  const percentage = Math.round((score / questions.length) * 100);

  document.getElementById("mcqBox").style.display = "none";
  document.getElementById("finalBox").style.display = "block";

  document.getElementById("finalScore").textContent =
    "Score: " + score + " / " + questions.length + " | Accuracy: " + percentage + "%";

  document.getElementById("finalFeedback").textContent =
    percentage === 100
      ? "Outstanding. Perfect accuracy. You have mastered this topic at a strong UPSC practice level."
      : "Good attempt. Revise the concepts and practise elimination logic again.";

  document.getElementById("retryBtn").style.display =
    percentage === 100 ? "none" : "block";
}

function retryQuiz() {
  currentIndex = 0;
  score = 0;
  userAnswers = new Array(questions.length).fill(null);

  document.getElementById("finalBox").style.display = "none";
  document.getElementById("mcqBox").style.display = "block";
  document.getElementById("retryBtn").style.display = "block";

  showQuestion();
}

function goBack() {
  document.getElementById("selectionBox").style.display = "block";
  document.getElementById("backButton").style.display = "none";
  document.getElementById("mcqBox").style.display = "none";
  document.getElementById("finalBox").style.display = "none";

  document.getElementById("subjectSelect").value = "";
  populateTopics();

  questions = [];
  currentIndex = 0;
  score = 0;
  userAnswers = [];
}

loadMCQs();
</script>

</body>
</html>

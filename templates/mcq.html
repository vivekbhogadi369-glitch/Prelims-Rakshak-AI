<!DOCTYPE html>
<html>
<head>
  <title>MCQ Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 16px;
      color: #111827;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 20px;
    }

    .box {
      background: white;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    .language-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .lang-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #e5e7eb;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .active-lang {
      background: #1f2937;
      color: white;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .progress-container {
      width: 100%;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      height: 12px;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #1f2937;
      transition: width 0.4s ease;
    }

    .progress-text {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .question-count {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .score {
      font-size: 15px;
      color: #111827;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .question {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .option {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 16px;
      line-height: 1.5;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .correct {
      background: #dcfce7;
      border: 2px solid #16a34a;
    }

    .wrong {
      background: #fee2e2;
      border: 2px solid #dc2626;
    }

    .resultBox {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #f9fafb;
      border-radius: 10px;
      line-height: 1.7;
    }

    .resultBox h3 {
      margin-top: 0;
      font-size: 17px;
    }

    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .nav-buttons button, .retry-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #1f2937;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .nav-buttons button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .final-score {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .feedback {
      text-align: center;
      line-height: 1.6;
      margin-bottom: 18px;
      color: #374151;
    }
  </style>
</head>

<body>

<h1>MCQ Practice</h1>

<div class="box">

  <div class="language-buttons">
    <button class="lang-btn active-lang" onclick="changeLanguage('english', this)">English</button>
    <button class="lang-btn" onclick="changeLanguage('telugu', this)">తెలుగు</button>
    <button class="lang-btn" onclick="changeLanguage('hindi', this)">हिन्दी</button>
  </div>

  <label>Select Subject</label>
  <select id="subjectSelect">
    <option value="">Select Subject</option>
  </select>

  <label>Select Topic</label>
  <select id="topicSelect">
    <option value="">Select Topic</option>
  </select>

</div>

<div id="mcqBox" class="box" style="display:none;">

  <div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div id="progressText" class="progress-text"></div>

  <div id="questionCount" class="question-count"></div>

  <div id="scoreBox" class="score"></div>

  <div id="questionText" class="question"></div>

  <div id="optionsBox"></div>

  <div id="explanationBox" class="resultBox">
    <h3>Explanation</h3>
    <p id="explanationText"></p>
  </div>

  <div id="eliminationBox" class="resultBox">
    <h3>Elimination Logic</h3>
    <p id="eliminationText"></p>
  </div>

  <div class="nav-buttons">
    <button id="prevBtn" onclick="previousQuestion()">Previous</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>
  </div>

</div>

<div id="finalBox" class="box" style="display:none;">
  <div id="finalScore" class="final-score"></div>
  <div id="finalFeedback" class="feedback"></div>
  <button id="retryBtn" class="retry-btn" onclick="retryQuiz()">Retry Quiz</button>
</div>

<script>

let mcqData = {};
let questions = [];
let currentIndex = 0;
let score = 0;
let userAnswers = [];
let currentLanguage = "english";

function changeLanguage(language, button) {

  currentLanguage = language;

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.remove("active-lang");
  });

  button.classList.add("active-lang");

  if (questions.length > 0) {
    showQuestion();
  }
}

async function loadMCQs() {

  try {

    const response = await fetch("/static/json/mcqs_history.json");

    mcqData = await response.json();

    const subjectSelect = document.getElementById("subjectSelect");

    Object.keys(mcqData).forEach(subject => {

      const option = document.createElement("option");

      option.value = subject;
      option.textContent = subject;

      subjectSelect.appendChild(option);

    });

  } catch (error) {

    alert("MCQ JSON loading failed.");
    console.error(error);

  }
}

document.getElementById("subjectSelect").addEventListener("change", function () {

  const subject = this.value;

  const topicSelect = document.getElementById("topicSelect");

  topicSelect.innerHTML = '<option value="">Select Topic</option>';

  document.getElementById("mcqBox").style.display = "none";

  document.getElementById("finalBox").style.display = "none";

  if (!subject) return;

  Object.keys(mcqData[subject]).forEach(topic => {

    const option = document.createElement("option");

    option.value = topic;
    option.textContent = topic;

    topicSelect.appendChild(option);

  });

});

document.getElementById("topicSelect").addEventListener("change", function () {

  const subject = document.getElementById("subjectSelect").value;

  const topic = this.value;

  if (!subject || !topic) return;

  questions = mcqData[subject][topic];

  currentIndex = 0;

  score = 0;

  userAnswers = new Array(questions.length).fill(null);

  document.getElementById("finalBox").style.display = "none";

  document.getElementById("mcqBox").style.display = "block";

  showQuestion();

});

function showQuestion() {

  const currentQuestion = questions[currentIndex];

  const selectedAnswer = userAnswers[currentIndex];

  const progressPercent = Math.round(((currentIndex + 1) / questions.length) * 100);

  document.getElementById("progressBar").style.width = progressPercent + "%";

  document.getElementById("progressText").textContent =
    "Progress: " + progressPercent + "%";

  document.getElementById("questionCount").textContent =
    "Question " + (currentIndex + 1) + " of " + questions.length;

  document.getElementById("scoreBox").textContent =
    "Score: " + score + " / " + questions.length;

  document.getElementById("questionText").textContent =
    currentQuestion["question_" + currentLanguage];

  document.getElementById("explanationBox").style.display = "none";

  document.getElementById("eliminationBox").style.display = "none";

  const optionsBox = document.getElementById("optionsBox");

  optionsBox.innerHTML = "";

  const currentOptions = currentQuestion["options_" + currentLanguage];

  Object.entries(currentOptions).forEach(([key, value]) => {

    const div = document.createElement("div");

    div.className = "option";

    div.textContent = key + ") " + value;

    if (selectedAnswer !== null) {

      if (key === currentQuestion.correct_answer) {
        div.classList.add("correct");
      }

      if (
        key === selectedAnswer &&
        selectedAnswer !== currentQuestion.correct_answer
      ) {
        div.classList.add("wrong");
      }

    } else {

      div.onclick = function () {
        checkAnswer(key);
      };

    }

    optionsBox.appendChild(div);

  });

  if (selectedAnswer !== null) {

    document.getElementById("explanationText").textContent =
      currentQuestion["explanation_" + currentLanguage];

    document.getElementById("eliminationText").textContent =
      currentQuestion["elimination_logic_" + currentLanguage];

    document.getElementById("explanationBox").style.display = "block";

    document.getElementById("eliminationBox").style.display = "block";
  }

  document.getElementById("prevBtn").disabled = currentIndex === 0;

  if (currentIndex === questions.length - 1) {
    document.getElementById("nextBtn").textContent = "Finish Quiz";
  } else {
    document.getElementById("nextBtn").textContent = "Next";
  }
}

function checkAnswer(selectedKey) {

  const currentQuestion = questions[currentIndex];

  if (userAnswers[currentIndex] !== null) return;

  userAnswers[currentIndex] = selectedKey;

  if (selectedKey === currentQuestion.correct_answer) {
    score++;
  }

  showQuestion();
}

function previousQuestion() {

  if (currentIndex > 0) {

    currentIndex--;

    showQuestion();

  }
}

function nextQuestion() {

  if (currentIndex < questions.length - 1) {

    currentIndex++;

    showQuestion();

  } else {

    showFinalResult();

  }
}

function showFinalResult() {

  const percentage = Math.round((score / questions.length) * 100);

  document.getElementById("mcqBox").style.display = "none";

  document.getElementById("finalBox").style.display = "block";

  document.getElementById("finalScore").textContent =
    "Score: " + score + " / " + questions.length +
    " | Accuracy: " + percentage + "%";

  let feedback = "";

  if (percentage === 100) {

    feedback =
      "Outstanding. Perfect accuracy. You have mastered this topic at a strong UPSC practice level.";

    document.getElementById("retryBtn").style.display = "none";

  } else if (percentage >= 80) {

    feedback =
      "Excellent. Your preparation is moving in a strong UPSC direction. Keep practising elimination logic.";

    document.getElementById("retryBtn").style.display = "block";

  } else if (percentage >= 50) {

    feedback =
      "Good attempt. Revise the concepts and focus more on statement-based traps.";

    document.getElementById("retryBtn").style.display = "block";

  } else {

    feedback =
      "Needs revision. Go back to notes, understand the basics, and attempt again with elimination logic.";

    document.getElementById("retryBtn").style.display = "block";
  }

  document.getElementById("finalFeedback").textContent = feedback;
}

function retryQuiz() {

  currentIndex = 0;

  score = 0;

  userAnswers = new Array(questions.length).fill(null);

  document.getElementById("finalBox").style.display = "none";

  document.getElementById("mcqBox").style.display = "block";

  document.getElementById("retryBtn").style.display = "block";

  showQuestion();
}

loadMCQs();

</script>

</body>
</html>

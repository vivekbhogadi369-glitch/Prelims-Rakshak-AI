<!DOCTYPE html>
<html>
<head>
  <title>MCQ Practice</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 16px;
      color: #111827;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
      color: #111827;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      margin-bottom: 18px;
    }

    .language-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .lang-btn {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #e5e7eb;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .active-lang {
      background: #1f2937;
      color: white;
    }

    label {
      font-size: 16px;
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      margin-top: 10px;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 16px;
      margin-bottom: 12px;
      background: #f9fafb;
    }

    .progress-container {
      width: 100%;
      height: 12px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #1f2937;
      transition: width 0.4s ease;
    }

    .progress-text,
    .question-count,
    .score {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #4b5563;
    }

    .question {
      font-size: 21px;
      font-weight: bold;
      line-height: 1.9;
      margin-top: 20px;
      margin-bottom: 26px;
      white-space: pre-line;
    }

    .option {
      background: #f3f4f6;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 14px;
      font-size: 19px;
      line-height: 1.8;
      border: 2px solid transparent;
      cursor: pointer;
      white-space: pre-line;
    }

    .correct {
      background: #dcfce7;
      border: 2px solid #16a34a;
    }

    .wrong {
      background: #fee2e2;
      border: 2px solid #dc2626;
    }

    .resultBox {
      display: none;
      margin-top: 18px;
      background: #f9fafb;
      padding: 18px;
      border-radius: 12px;
      line-height: 1.9;
    }

    .resultBox h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 20px;
    }

    .resultBox p {
      white-space: pre-line;
      font-size: 17px;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    .nav-buttons button,
    .retry-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .nav-buttons button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .final-score {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
      line-height: 1.7;
    }

    .feedback {
      text-align: center;
      font-size: 18px;
      line-height: 1.9;
      margin-bottom: 20px;
      white-space: pre-line;
    }

  </style>
</head>

<body>

<h1 id="pageTitle">MCQ Practice</h1>

<div class="box">

  <div class="language-buttons">

    <button class="lang-btn active-lang"
      onclick="changeLanguage('english', this)">
      English
    </button>

    <button class="lang-btn"
      onclick="changeLanguage('telugu', this)">
      తెలుగు
    </button>

    <button class="lang-btn"
      onclick="changeLanguage('hindi', this)">
      हिन्दी
    </button>

  </div>

  <label id="subjectLabel">Select Subject</label>

  <select id="subjectSelect">
    <option value="">Select Subject</option>
  </select>

  <label id="topicLabel">Select Topic</label>

  <select id="topicSelect">
    <option value="">Select Topic</option>
  </select>

</div>

<div id="mcqBox" class="box" style="display:none;">

  <div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div id="progressText" class="progress-text"></div>

  <div id="questionCount" class="question-count"></div>

  <div id="scoreBox" class="score"></div>

  <div id="questionText" class="question"></div>

  <div id="optionsBox"></div>

  <div id="explanationBox" class="resultBox">
    <h3 id="explanationHeading">Explanation</h3>
    <p id="explanationText"></p>
  </div>

  <div id="eliminationBox" class="resultBox">
    <h3 id="eliminationHeading">Elimination Logic</h3>
    <p id="eliminationText"></p>
  </div>

  <div class="nav-buttons">

    <button id="prevBtn" onclick="previousQuestion()">
      Previous
    </button>

    <button id="nextBtn" onclick="nextQuestion()">
      Next
    </button>

  </div>

</div>

<div id="finalBox" class="box" style="display:none;">

  <div id="finalScore" class="final-score"></div>

  <div id="finalFeedback" class="feedback"></div>

  <button id="retryBtn"
    class="retry-btn"
    onclick="retryQuiz()">
    Retry Quiz
  </button>

</div>

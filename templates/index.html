<!DOCTYPE html>
<html>
<head>
    <title>Prelims Rakshak AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 20px;
            background: #f5f7fb;
            text-align: center;
        }

        h1 {
            color: #1d3557;
            margin-bottom: 30px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .btn {
            display: block;
            width: 100%;
            margin: 15px 0;
            padding: 16px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
        }

        .pyq { background: #7c3aed; }
        .notes { background: #c2410c; }
        .mcq { background: #1d3557; }

        @media (max-width: 600px) {
            .btn {
                font-size: 16px;
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<h1>Prelims Rakshak AI</h1>

<div class="container">

    <button class="btn pyq" onclick="location.href='pyqs.html'">
        📘 Browse PYQs
    </button>

    <button class="btn notes" onclick="location.href='notes.html'">
        📙 Browse Notes
    </button>

    <button class="btn mcq" onclick="location.href='mcqs.html'">
        📝 Practice MCQs
    </button>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Notes - Prelims Rakshak AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 16px;
            background: #f5f7fb;
        }

        h1 {
            text-align: center;
            color: #1d3557;
        }

        .box {
            background: white;
            padding: 14px;
            border-radius: 14px;
        }

        button {
            padding: 9px 12px;
            border-radius: 10px;
            background: #c2410c;
            color: white;
            border: none;
        }

        .notes-box {
            margin-top: 12px;
            padding: 16px;
            background: #fffaf5;
            border-radius: 14px;
            line-height: 1.7;
            font-size: 15px;
            color: #222;
            white-space: pre-wrap; /* 🔥 KEY FIX */
        }
    </style>
</head>

<body>

<h1>Notes</h1>

<div class="box">
    <div id="subjects"></div>
    <div id="topics"></div>
    <div id="notesContent" class="notes-box"></div>
</div>

<script>
let notesData = {};

async function loadSubjects() {
    const res = await fetch('/static/history_notes.json');
    notesData = await res.json();

    let html = "";
    Object.keys(notesData).forEach(s => {
        html += `<button onclick="loadTopics('${s}')">${s}</button>`;
    });

    document.getElementById("subjects").innerHTML = html;
}

function loadTopics(subject) {
    let html = "";
    Object.keys(notesData[subject]).forEach(t => {
        html += `<button onclick="loadNotes('${subject}','${t}')">${t}</button>`;
    });

    document.getElementById("topics").innerHTML = html;
}

function loadNotes(subject, topic) {
    const content = notesData[subject][topic];

    let text = "";

    if (typeof content === "string") {
        text = content;
    } else {
        for (let key in content) {
            text += key + ":\n" + content[key] + "\n\n";
        }
    }

    /* ✅ ONLY SAFE CLEANING */
    text = text.replace(/[\uE000-\uF8FF]/g, ""); // remove hidden junk

    document.getElementById("notesContent").innerText = text;
}

loadSubjects();
</script>

</body>
</html>
